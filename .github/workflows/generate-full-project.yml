name: Generate Full Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install generator deps
        run: |
          python -m pip install --upgrade pip
          pip install -r generator/requirements.txt

      - name: Run generator
        run: |
          python generator/generate_repo.py

      - name: Commit & push generated project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Generate full project structure" || echo "No changes to commit"
          git push
